name: Blueprint brand and discovery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  brand-and-discovery:
    name: Approved brand and search metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-brand-search.mjs
